<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şirnaz Restaurant</title>
  <meta name="description" content="Şirnaz Ocakbaşı Restaurant'ın zengin ocakbaşı ve modern Türk lezzetlerini içeren premium dijital menüsü.">
  <link rel="icon" type="image/webp" href="/images/logo.webp">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash" class="splash-screen">
    <!-- Background Video Loop of Fireplace Embers/Steak Cooking -->
    <!-- We use a high quality cooking fire video loop. The src can be replaced easily. -->
    <video class="splash-bg" autoplay muted loop playsinline id="splash-video">
      <source src="/sirnaz-splash.mp4" type="video/mp4">
      <!-- Fallback is handled via CSS radial-gradient backdrop -->
    </video>
    <div class="splash-overlay"></div>
    
    <div class="splash-header">
      <img src="/images/logo.webp" alt="Şirnaz Logo" class="splash-logo">
      <span class="splash-since">Since 1997</span>
    </div>
    
    <div class="splash-footer">
      <button id="btn-enter" class="btn-premium">Menüyü Gör</button>
    </div>
  </div>

  <!-- Main Application Container -->
  <div class="app-container">
    
    <!-- Sticky Header -->
    <header class="main-header">
      <div style="display: flex; align-items: center;">
        <img src="/images/logo.webp" alt="Şirnaz Logo" class="header-logo">
      </div>
      <div class="header-actions">
        <!-- Language Switcher -->
        <button id="btn-lang" class="header-icon-btn" title="Dili Değiştir / Change Language" style="font-size: 0.75rem; font-weight: 700; font-family: var(--font-sans);">
          EN
        </button>
        <!-- Call Button -->
        <a href="tel:+902126616062" class="header-icon-btn" title="Ara" id="action-call">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </a>
        <!-- Map Button -->
        <a href="https://www.google.com/maps/search/?api=1&query=Ataköy+2-5-6+Adatepe+Sokak+2.+Kısım+Çarşısı+14Y+YD.1+Bakırköy+İstanbul" target="_blank" class="header-icon-btn" title="Yol Tarifi" id="action-map">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        </a>
      </div>
    </header>

    <!-- Category Selector (Sticky Navigation) -->
    <div class="category-nav-wrapper">
      <nav class="category-nav custom-scroll" id="category-nav">
        <!-- Dynamically loaded -->
        <button class="category-btn active">Yükleniyor...</button>
      </nav>
    </div>



    <!-- Search Input -->
    <div class="search-wrapper">
      <div class="search-container">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input type="text" id="search-input" class="search-input" placeholder="Lezzet arayın (örn. Kebap, Meze, Humus...)">
      </div>
    </div>

    <!-- Menu Sections -->
    <main id="menu-sections-container">
      <!-- Dynamically populated sections go here -->
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <img src="/images/logo.webp" alt="Şirnaz Logo" class="footer-logo">
      <div class="footer-since">Since 1997</div>
      
      <div class="footer-contact">
        <p id="footer-res-label">Rezervasyon & Sipariş:</p>
        <a href="tel:+902126616062">(0212) 661 60 62</a>
        <p>Ataköy 2-5-6 Adatepe Sokak 2. Kısım Çarşısı 14Y D:14/YD.1, 34158 Bakırköy/İstanbul</p>
      </div>

      <div class="footer-socials">
        <a href="https://instagram.com" target="_blank" class="social-link" title="Instagram">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
      </div>
      
      <!-- Pricing & Tax Update Info -->
      <div class="footer-pricing-info" style="margin-top: 24px; font-size: 0.75rem; color: var(--text-muted); line-height: 1.6;">
        <p id="footer-tax-notice"></p>
        <p id="footer-price-update" style="margin-top: 4px; font-style: italic; font-weight: 500;"></p>
      </div>
      
      <p class="footer-text" id="footer-copy-text" style="margin-top: 20px;">© 2026 Şirnaz Restaurant. Tüm hakları saklıdır.</p>
    </footer>

  </div>

  <!-- Food Item Detail Modal -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-container">
      <!-- Close Button -->
      <div class="modal-header-nav">
        <button id="btn-close-modal" class="btn-close-modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      
      <div class="modal-body custom-scroll">
        <!-- Immersive Image -->
        <div class="modal-image-wrapper" id="modal-image-container">
          <img src="" alt="" class="modal-image" id="modal-img">
        </div>
        
        <!-- Content -->
        <div class="modal-content">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px; flex-wrap: wrap;">
            <span class="modal-badge" id="modal-badge"></span>
            <span class="modal-weight" id="modal-weight"></span>
          </div>
          
          <div class="modal-title-row">
            <h2 class="modal-title" id="modal-title"></h2>
          </div>
          
          <p class="modal-description" id="modal-desc"></p>
          
          <div class="modal-details-section">
            <!-- Ingredients -->
            <div id="modal-ingredients-container">
              <h3 class="detail-block-title">İçindekiler</h3>
              <p class="detail-block-text" id="modal-ingredients"></p>
            </div>
            
            <!-- Allergens -->
            <div id="modal-allergens-container">
              <h3 class="detail-block-title">Alerjen Uyarısı</h3>
              <p class="detail-block-text" id="modal-allergens"></p>
            </div>
            
            <!-- Sommelier / Pairing Recommendation -->
            <div id="modal-pairing-container">
              <h3 class="detail-block-title">Uyumlu İçecek Önerisi</h3>
              <p class="detail-block-text" id="modal-pairing"></p>
            </div>

            <!-- Pork-Free Safety Banner -->
            <div class="safety-banner">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c53030" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; flex-shrink: 0;"><polyline points="20 6 9 17 4 12"/></svg>
              <span id="modal-pork-text"></span>
            </div>

            <!-- Nutrition Grid (Accordion style) -->
            <div id="modal-nutrition-container" class="nutrition-accordion" style="display: none;">
              <button class="nutrition-accordion-trigger" id="btn-toggle-nutrition" type="button">
                <span id="modal-nutrition-title">Besin Değerleri</span>
                <svg class="accordion-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="nutrition-accordion-content" id="nutrition-accordion-content">
                <div class="modal-nutrition-grid" style="margin-top: 12px;">
                  <div class="nutrition-item">
                    <span class="nutrition-val" id="modal-nutrition-cal">-</span>
                    <span class="nutrition-lbl" id="modal-lbl-cal">Kalori</span>
                  </div>
                  <div class="nutrition-item">
                    <span class="nutrition-val" id="modal-nutrition-prot">-</span>
                    <span class="nutrition-lbl" id="modal-lbl-prot">Protein</span>
                  </div>
                  <div class="nutrition-item">
                    <span class="nutrition-val" id="modal-nutrition-carbs">-</span>
                    <span class="nutrition-lbl" id="modal-lbl-carbs">Karbonhidrat</span>
                  </div>
                  <div class="nutrition-item">
                    <span class="nutrition-val" id="modal-nutrition-fat">-</span>
                    <span class="nutrition-lbl" id="modal-lbl-fat">Yağ</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Price Footer -->
      <div class="modal-price-footer">
        <span class="modal-price" id="modal-price"></span>
      </div>
    </div>
  </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
